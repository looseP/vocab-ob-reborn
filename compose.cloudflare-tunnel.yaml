# Overlay on compose.single-host.yaml. cloudflared is a long-running deployed
# container, so it gets the same ADR-0026 json-file rotation as the base stack.
# The `caddy` entry here is a partial override (ports reset only); its logging
# comes from the base file's service definition, not this layer, so it is not
# repeated here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    ports: !reset []

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?CLOUDFLARED_IMAGE is required}
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - public
    depends_on:
      caddy:
        condition: service_healthy
    logging: *default-logging

networks:
  public:
    external: false
